map $arg_os_type $qjqp_hot_update_platform {
    default "";
    ~*android android;
    ~*ios ios;
}

map $qjqp_hot_update_platform $qjqp_hot_update_url {
    default "";
    android https://114.117.178.215/hot-update/android/;
    ios https://114.117.178.215/hot-update/ios/;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/114.117.178.215/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/114.117.178.215/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:qjqp_migration_tls:10m;
    ssl_session_timeout 1d;

    location = /version {
        if ($qjqp_hot_update_platform = "") { return 404; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"err_code":"0","data":{"action":"1","assert_version":"268","assert_url":"$qjqp_hot_update_url"}}';
    }

    location ^~ /hot-update/ {
        root /var/www/qjqp-migration;
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
