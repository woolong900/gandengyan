server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gmhiu.com www.gmhiu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://gmhiu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gmhiu.com;

    ssl_certificate /etc/letsencrypt/live/gmhiu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmhiu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://gmhiu.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name gmhiu.com;

    ssl_certificate /etc/letsencrypt/live/gmhiu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmhiu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:qjqp_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

