# Backward-compatible gateway for clients whose embedded service URL still
# points at 43.132.230.5. The game process on this host stays stopped; every
# HTTP/WebSocket request is forwarded to the gmhiu.com production service.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://43.132.230.5$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/43.132.230.5/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.132.230.5/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:qjqp_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    location / {
        proxy_pass https://gmhiu.com;
        proxy_ssl_server_name on;
        proxy_ssl_name gmhiu.com;
        proxy_http_version 1.1;
        proxy_set_header Host gmhiu.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
