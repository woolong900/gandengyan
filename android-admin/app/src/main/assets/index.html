<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>秘密武器</title>
  <style>
    :root{color-scheme:dark;--bg:#08121d;--panel:#111d2b;--raised:#18283a;--line:#ffffff18;--muted:#91a2b6;--accent:#2eb8ed;--green:#35d07f;--danger:#ff6473}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 15% 0,#12304a 0,var(--bg) 46%,#03070c 100%);color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .bar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);background:#08121dd9;backdrop-filter:blur(14px)}.title{font-size:23px;font-weight:900;letter-spacing:.5px}.sub{font-size:11px;color:var(--muted);margin-top:2px}.spacer{flex:1}.pill{padding:7px 11px;border-radius:999px;background:#2eb8ed20;color:var(--accent);font-weight:800;font-size:12px}.btn{border:1px solid #ffffff25;background:#ffffff0c;border-radius:10px;padding:8px 12px;font-weight:750}.btn:active{transform:scale(.97);background:#ffffff18}.btn.primary{background:#158ec4;border-color:#49caff}.btn.danger{color:#ff8995;border-color:#ff647355;background:#ff647315}.btn:disabled{opacity:.35}.content{min-height:0;flex:1;overflow:auto;padding:18px}.rooms{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px}.room{border:1px solid var(--line);background:linear-gradient(145deg,#1a2d42,#101b29);border-radius:17px;padding:15px;text-align:left;box-shadow:0 8px 22px #0005}.room:active{border-color:var(--accent);transform:scale(.988)}.roomtop{display:flex;align-items:center}.roomid{font-size:22px;font-weight:900;font-family:ui-monospace,monospace}.status{margin-left:auto;font-size:11px;font-weight:850;color:#ffb85c}.status.playing{color:var(--green)}.facts{display:flex;gap:15px;color:var(--muted);font-size:12px;margin:12px 0}.club{font-size:11px;color:var(--accent)}
    .detail{display:flex;flex:1;min-height:0}.players{width:44%;min-width:340px;background:#0c1825c9;border-right:1px solid var(--line);display:flex;flex-direction:column}.paneTitle{height:48px;flex:none;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:850}.scroll{overflow:auto;min-height:0;padding:0 11px 13px}.player{border:1px solid var(--line);background:var(--raised);border-radius:13px;padding:10px;margin-bottom:9px}.player.selected{border:2px solid var(--accent);background:#2eb8ed1b}.person{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#2eb8ed25;color:var(--accent);font-weight:900}.name{font-size:13px;font-weight:800}.meta{font-size:9px;color:var(--muted);margin-top:2px}.online{margin-left:auto;font-size:9px;font-weight:850;color:var(--green)}.offline{color:var(--muted)}.hand{display:flex;gap:3px;overflow-x:auto;padding:9px 2px 2px}.empty{font-size:11px;color:var(--muted);padding:14px 3px}.planner{flex:1;min-width:0;display:flex;flex-direction:column;background:#14223680}.plannerBody{overflow:auto;padding:0 14px 16px}.hint{font-size:11px;color:var(--muted);margin:2px 0 12px}.tileGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:9px}.tileButton{border:0;background:#07111b99;border-radius:10px;padding:7px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:4px}.tileButton:disabled{opacity:.3}.count{font-size:9px;color:var(--muted)}
    .tile{position:relative;width:39px;height:54px;border-radius:6px;background:linear-gradient(#fff,#f4f1e3);border:1.2px solid #1d4037;box-shadow:0 3px 0 #176648,0 4px 7px #0008;display:inline-grid;place-items:center;flex:none}.tile:after{content:"";position:absolute;inset:1px;border:1px solid #fff;border-radius:4px;pointer-events:none}.tile img{position:relative;z-index:1;width:35px;height:48px;object-fit:contain}.drawn:before{content:"";position:absolute;z-index:3;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ff9b36}.divider{height:1px;background:var(--line);margin:16px 0 12px}.plan{display:flex;gap:9px;overflow-x:auto;padding:7px 2px 11px}.planItem{flex:none;background:#050a1188;border-radius:10px;padding:5px;text-align:center}.order{font-size:9px;color:var(--accent);font-weight:900;margin-bottom:3px}.minirow{display:flex;gap:2px;margin-top:6px}.mini{border:0;border-radius:5px;background:#ffffff12;width:27px;height:24px;padding:0}.mini:disabled{opacity:.2}.rankGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.rank{display:flex;align-items:center;gap:7px;background:#0b1622;border-radius:10px;padding:8px}.poker{width:35px;height:46px;border-radius:6px;background:white;color:#d9223e;display:grid;place-items:center;font-weight:900;font-family:serif}.rank .mini{background:#2eb8ed22;color:var(--accent);font-size:18px}.rankCount{width:20px;text-align:center;font-weight:800}.actions{display:flex;gap:9px;margin-top:14px}.loading,.emptyPage,.errorPage{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.spinner{width:25px;height:25px;border:3px solid #ffffff22;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}#toast{position:fixed;left:50%;bottom:18px;z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111d2bf2;border:1px solid #ffffff22;padding:10px 16px;border-radius:10px;box-shadow:0 8px 28px #0008;transition:.2s}#toast.show{transform:translate(-50%,0);opacity:1}#toast.bad{border-color:#ff647366;color:#ffb1b9}@media(max-width:780px){.rooms{grid-template-columns:repeat(2,minmax(190px,1fr))}.players{min-width:300px}.bar{height:58px}.title{font-size:19px}}
  </style>
</head>
<body><main id="app"></main><div id="toast"></div>
<script>
  const app=document.getElementById('app'),toastNode=document.getElementById('toast');
  let sequence=0,pending=new Map(),epoch=0,timer=null,paused=false,currentRoomId=null,currentRoom=null,selectedUid=null,wskDraft={},wskDirty=false,busy=false;
  function request(method,path,body=null){return new Promise((resolve,reject)=>{const id=String(++sequence);pending.set(id,{resolve,reject});SecretWeapon.request(method,path,body?JSON.stringify(body):'',id)})}
  window.__nativeResponse=(id,result)=>{const call=pending.get(id);if(!call)return;pending.delete(id);let body={};try{body=JSON.parse(result.body||'{}')}catch(e){}if(result.ok)call.resolve(body);else call.reject(new Error(body.error||result.error||`请求失败（${result.status}）`))};
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(message,bad=false){toastNode.textContent=message;toastNode.className='show'+(bad?' bad':'');clearTimeout(toastNode._t);toastNode._t=setTimeout(()=>toastNode.className='',2200)}
  function clearPoll(){clearTimeout(timer);timer=null} function schedule(fn,ms){clearPoll();if(!paused)timer=setTimeout(fn,ms)}
  function shell(left,right){app.innerHTML=`<header class="bar">${left}<span class="spacer"></span>${right||''}</header><section id="body" class="content"></section>`;return document.getElementById('body')}
  function loading(text){return `<div class="loading"><div><div class="spinner"></div>${esc(text)}</div></div>`}
  function showRooms(){epoch++;currentRoomId=null;currentRoom=null;selectedUid=null;wskDirty=false;clearPoll();const body=shell(`<div><div class="title">秘密武器</div><div class="sub">房间列表 · 已自动安全登录</div></div>`,`<span id="roomCount" class="pill">-- 个房间</span><button class="btn" onclick="refreshRooms(false)">刷新</button>`);body.innerHTML=loading('正在读取房间…');refreshRooms(false)}
  async function refreshRooms(silent=true){const version=epoch;try{const data=await request('GET','/rooms?limit=100');if(version!==epoch||currentRoomId!==null)return;renderRooms(data.items||[])}catch(error){if(version!==epoch)return;if(!silent)document.getElementById('body').innerHTML=`<div class="errorPage"><div><div>${esc(error.message)}</div><button class="btn" onclick="refreshRooms(false)" style="margin-top:12px">重试</button></div></div>`}finally{if(version===epoch&&currentRoomId===null)schedule(()=>refreshRooms(true),6000)}}
  function renderRooms(rooms){document.getElementById('roomCount').textContent=`${rooms.length} 个房间`;const body=document.getElementById('body');if(!rooms.length){body.innerHTML='<div class="emptyPage"><div><div style="font-size:38px">▤</div><b>暂无房间</b><div class="sub">有玩家创建房间后会自动显示</div></div></div>';return}body.innerHTML=`<div class="rooms">${rooms.map(r=>`<button class="room" onclick="openRoom(${Number(r.roomId)})"><div class="roomtop"><span class="roomid">#${esc(r.roomId)}</span><span class="status ${r.status==='进行中'?'playing':''}">${esc(r.status)}</span></div><div class="facts"><span>👥 ${r.occupied}/${r.maxPlayers}</span><span>🏁 ${r.step}/${r.totalStep} 局</span>${r.botCount?`<span>🤖 ${r.botCount}</span>`:''}</div><div class="club">${r.clubId?`俱乐部 #${r.clubId}`:'普通房'}</div></button>`).join('')}</div>`}
  function openRoom(id){epoch++;currentRoomId=id;currentRoom=null;selectedUid=null;wskDirty=false;clearPoll();const body=shell(`<button class="btn" onclick="showRooms()">‹ 房间列表</button><div id="roomTitle"><div class="title">房间 #${id}</div></div>`,`<span id="working"></span><button class="btn" onclick="refreshRoom(false)">刷新</button>`);body.className='detail';body.innerHTML=loading('正在进入房间…');refreshRoom(false)}
  async function refreshRoom(silent=true){const version=epoch,id=currentRoomId;if(id===null)return;try{const room=await request('GET',`/rooms/${id}`);if(version!==epoch||id!==currentRoomId)return;currentRoom=room;syncSelection();renderDetail()}catch(error){if(version!==epoch)return;if(!silent)document.getElementById('body').innerHTML=`<div class="errorPage"><div><div>${esc(error.message)}</div><button class="btn" onclick="refreshRoom(false)" style="margin-top:12px">重试</button></div></div>`}finally{if(version===epoch&&id===currentRoomId)schedule(()=>refreshRoom(true),3500)}}
  function syncSelection(){if(!currentRoom)return;const members=currentRoom.members||[],valid=members.some(m=>m.uid===selectedUid&&!m.spectator);const planned=currentRoom.gameType===17?currentRoom.nextWskHandPlan?.uid:currentRoom.wall?.drawPlan?.uid;if(!valid)selectedUid=planned??members.find(m=>!m.spectator)?.uid??null;if(currentRoom.gameType===17&&!wskDirty)wskDraft={...(currentRoom.nextWskHandPlan?.counts||{})}}
  function renderDetail(){const r=currentRoom;if(!r)return;document.getElementById('roomTitle').innerHTML=`<div class="title">房间 #${r.roomId}</div><div class="sub">${esc(r.status)} · 第 ${r.step}/${r.totalStep} 局 · ${r.occupied}/${r.maxPlayers} 人</div>`;const body=document.getElementById('body');body.className='detail';body.innerHTML=`<aside class="players"><div class="paneTitle">🃏 玩家手牌</div><div class="scroll">${(r.members||[]).map(playerCard).join('')}</div></aside><section class="planner">${r.gameType===17?renderWsk():renderMahjong()}</section>`}
  function playerCard(m){const selected=m.uid===selectedUid,hand=m.hand||[];return `<div class="player ${selected?'selected':''}" onclick="selectPlayer(${m.uid},${!!m.spectator})"><div class="person"><div class="avatar">${esc((m.nickname||'?').slice(0,1))}</div><div><div class="name">${esc(m.nickname)}</div><div class="meta">座位 ${m.site} · ID ${m.uid} · ${formatScore(m.score)}分</div></div><span class="online ${m.online?'':'offline'}">${m.bot?'机器人':m.online?'在线':'离线'}</span></div><div class="hand">${hand.length?hand.map((c,i)=>currentRoom.gameType===17?poker(c):tile(c,m.drawnCard!=null&&i===hand.length-1)).join(''):`<span class="empty">${m.spectator?'观战玩家':'尚未开局或暂无手牌'}</span>`}</div></div>`}
  function formatScore(n){return Number.isInteger(Number(n))?String(Number(n)):Number(n||0).toFixed(1)}
  async function selectPlayer(uid,spectator){if(spectator||uid===selectedUid)return;selectedUid=uid;if(currentRoom.gameType===17){wskDraft={};wskDirty=true;renderDetail()}else if(currentRoom.wall?.drawPlan){await mutate('DELETE',`/rooms/${currentRoomId}/draw-plan`,null)}else renderDetail()}
  function tile(card,drawn=false){const suit=Math.floor(card/10),point=card%10,valid=suit>=0&&suit<=2&&point>=1&&point<=9;return `<span class="tile ${drawn?'drawn':''}">${valid?`<img src="tiles/mj_${suit}_${point}.png">`:`<b style="color:#111">${card}</b>`}</span>`}
  function poker(card){if(card===170)return '<span class="poker">小★</span>';if(card===180)return '<span class="poker" style="color:#54258b">大★</span>';const value=Math.floor(card/10),suit=card%10,rank=({1:'A',11:'J',12:'Q',13:'K'})[value]||value,symbol=({1:'♦',2:'♣',3:'♥',4:'♠'})[suit]||'?';return `<span class="poker" style="color:${suit===1||suit===3?'#d9223e':'#111'}"><span>${rank}<br>${symbol}</span></span>`}
  function targetName(){return esc((currentRoom.members||[]).find(m=>m.uid===selectedUid)?.nickname||'请在左侧选择玩家')}
  function renderMahjong(){const wall=currentRoom.wall;if(!wall)return '<div class="paneTitle">☝ 选择下一轮摸牌</div><div class="emptyPage"><div><b>尚未开局</b><div class="sub">牌局开始后即可选择摸牌顺序</div></div></div>';const plan=wall.drawPlan?.cards||[],all={};(wall.cards||[]).forEach(c=>all[c]=(all[c]||0)+1);plan.forEach(c=>all[c]=Math.max(0,(all[c]||0)-1));const cards=Object.keys(all).map(Number).sort((a,b)=>a-b);return `<div class="paneTitle">☝ 选择下一轮摸牌<span class="spacer"></span><span class="sub">${targetName()}</span></div><div class="plannerBody"><div class="hint">剩余牌堆 ${wall.remaining} 张 · 点击牌面立即生效</div><div class="tileGrid">${cards.map(c=>`<button class="tileButton" ${!all[c]||selectedUid==null||busy?'disabled':''} onclick="appendCard(${c})">${tile(c)}<span class="count">可选 ${all[c]}</span></button>`).join('')}</div><div class="divider"></div><div class="paneTitle" style="padding:0;height:34px">已指定牌序<span class="spacer"></span><span class="sub">${plan.length} 张</span></div>${plan.length?`<div class="plan">${plan.map((c,i)=>`<div class="planItem"><div class="order">${i+1}</div>${tile(c)}<div class="minirow"><button class="mini" ${i===0||busy?'disabled':''} onclick="moveCard(${i},${i-1})">←</button><button class="mini" ${busy?'disabled':''} onclick="removeCard(${i})">×</button><button class="mini" ${i===plan.length-1||busy?'disabled':''} onclick="moveCard(${i},${i+1})">→</button></div></div>`).join('')}</div><button class="btn danger" ${busy?'disabled':''} onclick="clearPlan()">清空指定牌序</button>`:'<div class="hint">尚未选择；未指定部分保持随机。</div>'}</div>`}
  function renderWsk(){const ranks=[['3','3',8],['4','4',8],['5','5',8],['6','6',8],['7','7',8],['8','8',8],['9','9',8],['10','10',8],['11','J',8],['12','Q',8],['13','K',8],['14','A',8],['15','2',8],['joker','鬼',4]],total=Object.values(wskDraft).reduce((a,b)=>a+Number(b),0);return `<div class="paneTitle">🃏 指定下一局起手牌<span class="spacer"></span><span class="sub">${targetName()}</span></div><div class="plannerBody"><div class="hint">点击 + / − 调整数量；未指定部分保持随机。已选 ${total} 张。</div><div class="rankGrid">${ranks.map(([key,label,max])=>`<div class="rank"><span class="poker">${label}</span><span class="spacer"></span><button class="mini" ${(wskDraft[key]||0)<=0?'disabled':''} onclick="changeRank('${key}',-1,${max})">−</button><span class="rankCount">${wskDraft[key]||0}</span><button class="mini" ${(wskDraft[key]||0)>=max?'disabled':''} onclick="changeRank('${key}',1,${max})">+</button></div>`).join('')}</div><div class="actions"><button class="btn primary" ${selectedUid==null||total===0||total>27||busy?'disabled':''} onclick="saveWsk()">保存到下一局</button><button class="btn danger" ${busy?'disabled':''} onclick="clearWsk()">恢复随机</button></div></div>`}
  function changeRank(key,delta,max){const next=Math.max(0,Math.min(max,(wskDraft[key]||0)+delta));if(next)wskDraft[key]=next;else delete wskDraft[key];wskDirty=true;renderDetail()}
  async function mutate(method,path,body,success=''){if(busy)return;busy=true;renderDetail();document.getElementById('working').innerHTML='<div class="spinner" style="width:18px;height:18px;margin:0"></div>';try{await request(method,path,body);if(success)toast(success);await refreshRoom(true)}catch(error){toast(error.message,true)}finally{busy=false;if(document.getElementById('working'))document.getElementById('working').innerHTML='';if(currentRoom)renderDetail()}}
  function appendCard(card){if(selectedUid!=null)mutate('POST',`/rooms/${currentRoomId}/draw-plan/card`,{uid:selectedUid,card})}function removeCard(index){if(selectedUid!=null)mutate('POST',`/rooms/${currentRoomId}/draw-plan/remove`,{uid:selectedUid,index})}function moveCard(from,to){if(selectedUid!=null)mutate('POST',`/rooms/${currentRoomId}/draw-plan/move`,{uid:selectedUid,from,to})}function clearPlan(){mutate('DELETE',`/rooms/${currentRoomId}/draw-plan`,null)}
  async function saveWsk(){if(selectedUid==null)return;await mutate('POST',`/rooms/${currentRoomId}/next-wsk-hand`,{uid:selectedUid,counts:wskDraft},'已保存');wskDirty=false}async function clearWsk(){await mutate('DELETE',`/rooms/${currentRoomId}/next-wsk-hand`,null,'已恢复随机');wskDraft={};wskDirty=false}
  window.appBack=()=>{if(currentRoomId!==null){showRooms();return true}return false};window.pauseApp=()=>{paused=true;clearPoll()};window.resumeApp=()=>{if(!paused)return;paused=false;if(currentRoomId===null)refreshRooms(true);else refreshRoom(true)};showRooms();
</script></body></html>
